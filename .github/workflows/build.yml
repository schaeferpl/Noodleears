name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Set up Android SDK build tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "ndk;27.1.12297006"
      
      - name: Download Whisper model
        run: |
          mkdir -p android/app/src/main/assets
          curl -L \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" \
            -o android/app/src/main/assets/ggml-base.bin
      
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      
      # ZMIANA: Z assembleDebug na assembleRelease (zapieka kod JS wewnątrz pliku)
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
      
      # ZMIANA: Pobieranie z folderu release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noodleEars-app
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7